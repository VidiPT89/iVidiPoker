name = "ividipoker"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR-PUBLIC-ANON-KEY"

[[durable_objects.bindings]]
name = "TABLES"
class_name = "Tables"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tables"]
